spring.application.name=office-manager

spring.config.import=optional:file:./application-local.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/office_manager_dev?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.datasource.hikari.maximum-pool-size=10

mybatis.mapper-locations=classpath:mappers/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.jdbc-type-for-null=NULL
mybatis.configuration.call-setters-on-nulls=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.whitelabel.enabled=false

spring.thymeleaf.cache=false

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

app.bootstrap.enabled=${APP_BOOTSTRAP_ENABLED:true}
app.storage.root=${APP_STORAGE_ROOT:./uploads}
app.storage.allowed-extensions=jpg,jpeg,png,gif,webp,pdf,xls,xlsx,doc,docx,ppt,pptx,txt,zip
app.security.remember-me-key=${REMEMBER_ME_KEY:office-manager-local-remember-key-change-in-production}
