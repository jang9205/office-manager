<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell('근태관리', ~{::main})}">
<main>
    <section class="page-heading"><div><h2>나의 근태</h2><p>출퇴근을 기록하고 근무시간을 확인하세요.</p></div></section>
    <article class="card attendance-hero">
        <div><div class="live-clock" data-live-clock>00:00:00</div><p th:text="${@viewDate.format(currentDate,'yyyy년 M월 d일 EEEE')}">오늘</p><div style="margin-top:14px" th:if="${!today.isEmpty()}"><span class="status" th:classappend="${#strings.toLowerCase(today.status)}" th:text="${today.status == 'NORMAL' ? '정상 근무' : (today.status == 'LATE' ? '지각' : (today.status == 'EARLY_LEAVE' ? '조퇴' : today.status))}">정상</span><small style="margin-left:8px;color:#aab4c4">출근 <span th:text="${today.clockInAt == null ? '-' : @viewDate.format(today.clockInAt,'HH:mm')}">-</span> · 퇴근 <span th:text="${today.clockOutAt == null ? '-' : @viewDate.format(today.clockOutAt,'HH:mm')}">-</span></small></div></div>
        <div class="clock-actions"><button class="button primary" data-api-action="/api/v1/attendance/clock-in" data-method="POST" th:disabled="${!today.isEmpty()}">출근하기</button><button class="button secondary" data-api-action="/api/v1/attendance/clock-out" data-method="POST" th:disabled="${today.isEmpty() or today.clockOutAt != null}">퇴근하기</button></div>
    </article>
    <section class="grid grid-4" style="margin-top:18px" th:if="${!today.isEmpty()}"><article class="card metric-card"><span class="metric-label">출근 시각</span><div class="metric-value" style="font-size:22px" th:text="${@viewDate.format(today.clockInAt,'HH:mm')}">09:00</div></article><article class="card metric-card"><span class="metric-label">퇴근 시각</span><div class="metric-value" style="font-size:22px" th:text="${today.clockOutAt == null ? '-' : @viewDate.format(today.clockOutAt,'HH:mm')}">-</div></article><article class="card metric-card warning"><span class="metric-label">지각 시간</span><div class="metric-value" style="font-size:22px" th:text="${today.lateMinutes + '분'}">0분</div></article><article class="card metric-card success"><span class="metric-label">근무 시간</span><div class="metric-value" style="font-size:22px" th:text="${today.workMinutes == null ? '-' : (today.workMinutes / 60) + '시간 ' + (today.workMinutes % 60) + '분'}">-</div></article></section>
    <article class="card" style="margin-top:18px"><header class="card-header"><div><h3>근태 기록</h3><p>최근 출퇴근 내역입니다.</p></div></header><div class="table-wrap"><table><thead><tr><th>근무일</th><th>출근</th><th>퇴근</th><th>근무시간</th><th>지각</th><th>조퇴</th><th>상태</th></tr></thead><tbody><tr th:each="item : ${history.content}"><td th:text="${@viewDate.format(item.workDate,'yyyy.MM.dd E')}">날짜</td><td th:text="${item.clockInAt == null ? '-' : @viewDate.format(item.clockInAt,'HH:mm')}">-</td><td th:text="${item.clockOutAt == null ? '-' : @viewDate.format(item.clockOutAt,'HH:mm')}">-</td><td th:text="${item.workMinutes == null ? '-' : (item.workMinutes / 60) + '시간 ' + (item.workMinutes % 60) + '분'}">-</td><td th:text="${item.lateMinutes + '분'}">0분</td><td th:text="${item.earlyLeaveMinutes + '분'}">0분</td><td><span class="status" th:classappend="${#strings.toLowerCase(item.status)}" th:text="${item.status == 'NORMAL' ? '정상' : (item.status == 'LATE' ? '지각' : (item.status == 'EARLY_LEAVE' ? '조퇴' : item.status))}">정상</span></td></tr></tbody></table></div><div class="empty-mini" th:if="${#lists.isEmpty(history.content)}">근태 기록이 없습니다.</div></article>
</main>
</html>
