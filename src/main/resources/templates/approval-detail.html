<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell('결재 문서', ~{::main})}">
<main>
    <section class="page-heading"><div><a class="text-button" th:href="@{/approvals}">← 결재 목록</a><h2 th:text="${document.title}">결재 제목</h2><p><span th:text="${document.documentNumber}">번호</span> · <span th:text="${document.drafterName}">기안자</span></p></div><div class="page-actions" th:if="${canApprove}"><button class="button danger" th:attr="data-api-action=@{/api/v1/approvals/{id}/reject(id=${document.documentId})}" data-method="POST" data-prompt="반려 사유를 입력하세요." data-success-url="/approvals">반려</button><button class="button success" th:attr="data-api-action=@{/api/v1/approvals/{id}/approve(id=${document.documentId})}" data-method="POST" data-prompt="결재 의견을 입력하세요. (선택)" data-success-url="/approvals">승인</button></div></section>
    <section class="grid approval-detail-layout">
        <article class="card article"><header class="article-header"><span class="status" th:classappend="${#strings.toLowerCase(document.status)}" th:text="${document.status == 'PENDING' ? '결재 진행 중' : (document.status == 'APPROVED' ? '최종 승인' : '반려')}">진행</span><h2 th:text="${document.title}">제목</h2><div class="article-meta"><span th:text="${document.drafterName}">기안자</span><span th:text="${document.departmentName ?: '-'}">부서</span><span th:text="${document.positionName ?: '-'}">직급</span><span th:text="${document.submittedAt == null ? '-' : @viewDate.format(document.submittedAt,'yyyy.MM.dd HH:mm')}">일시</span></div></header><div class="article-content" th:text="${document.content}">내용</div><div th:if="${!#lists.isEmpty(document.attachments)}"><h3 class="attachment-title">첨부파일</h3><div class="attachment-list"><a class="list-item" th:each="file : ${document.attachments}" th:href="@{/files/{id}(id=${file.fileId})}"><span class="list-icon">↓</span><span class="list-copy"><strong th:text="${file.originalName}">파일</strong><small th:text="${#numbers.formatDecimal(file.sizeBytes / 1024.0,1,1) + ' KB'}">크기</small></span><span class="text-button">다운로드</span></a></div></div></article>
        <aside class="card"><header class="card-header"><div><h3>결재선</h3><p>순서대로 결재가 진행됩니다.</p></div></header><div class="card-body timeline"><div class="timeline-item" th:each="line : ${document.lines}"><span class="timeline-dot" th:text="${line.stepOrder}">1</span><div class="timeline-copy"><strong th:text="${line.approverName}">박팀장</strong><small><span th:text="${line.approverDepartment ?: '-'}">부서</span> · <span th:text="${line.approverPosition ?: '-'}">직급</span></small><span class="status" style="margin-top:7px" th:classappend="${#strings.toLowerCase(line.status)}" th:text="${line.status == 'PENDING' ? '결재 대기' : (line.status == 'WAITING' ? '순서 대기' : (line.status == 'APPROVED' ? '승인' : (line.status == 'REJECTED' ? '반려' : line.status)))}">대기</span><small th:if="${line.opinion}" th:text="${'의견: ' + line.opinion}" style="margin-top:6px"></small><small th:if="${line.rejectionReason}" th:text="${'반려 사유: ' + line.rejectionReason}" style="margin-top:6px;color:var(--danger)"></small></div></div></div></aside>
    </section>
</main>
</html>
