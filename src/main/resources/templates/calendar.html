<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell('일정관리', ~{::main})}">
<main>
    <section class="page-heading"><div><h2>회사 일정</h2><p>회의, 교육, 휴가와 사내 행사를 한눈에 확인하세요.</p></div><button class="button primary" data-modal-open="eventModal">＋ 일정 등록</button></section>
    <div class="calendar-toolbar"><div class="page-actions"><a class="button secondary small" th:href="@{/calendar(month=${previousMonth})}">‹</a><a class="button secondary small" th:href="@{/calendar}">오늘</a><a class="button secondary small" th:href="@{/calendar(month=${nextMonth})}">›</a></div><h2 th:text="${@viewDate.format(targetMonth,'yyyy년 M월')}">2026년 8월</h2><span></span></div>
    <section class="calendar-grid"><div class="calendar-weekday">일</div><div class="calendar-weekday">월</div><div class="calendar-weekday">화</div><div class="calendar-weekday">수</div><div class="calendar-weekday">목</div><div class="calendar-weekday">금</div><div class="calendar-weekday">토</div><div class="calendar-day" th:each="day : ${calendarDays}" th:classappend="${(!day.currentMonth ? ' muted' : '') + (day.today ? ' today' : '')}"><span class="day-number" th:text="${day.date.dayOfMonth}">1</span><span class="calendar-event" th:each="event : ${day.events}" th:style="${'--event-color:' + (event.color ?: '#4f46e5')}" th:text="${event.title}" th:title="${event.title + (event.location != null ? ' · ' + event.location : '')}">일정</span></div></section>
    <div class="modal" id="eventModal"><div class="modal-dialog"><header class="modal-header"><div><h3>새 일정 등록</h3><p>공개 범위에 따라 구성원에게 표시됩니다.</p></div><button class="modal-close" data-modal-close>×</button></header><form th:action="@{/api/v1/events}" method="post" data-json-form data-success-url="/calendar"><div class="modal-body form-grid"><div class="field"><label>일정 종류 *</label><select name="eventType"><option value="MEETING">회의</option><option value="TRAINING">교육</option><option value="COMPANY_EVENT">회사 행사</option><option value="ETC">기타</option></select></div><div class="field"><label>공개 범위 *</label><select name="visibility"><option value="COMPANY">회사 전체</option><option value="DEPARTMENT">부서</option><option value="PRIVATE">나만 보기</option></select></div><div class="field span-2"><label>제목 *</label><input name="title" required maxlength="200"></div><div class="field"><label>시작 *</label><input type="datetime-local" name="startsAt" required></div><div class="field"><label>종료 *</label><input type="datetime-local" name="endsAt" required></div><div class="field"><label>장소</label><input name="location" maxlength="255"></div><div class="field"><label>색상</label><input type="color" name="color" value="#4f46e5"></div><div class="field span-2"><label>설명</label><textarea name="description"></textarea></div><label class="check-row"><input type="checkbox" name="allDay"> 종일 일정</label></div><footer class="modal-footer"><button class="button secondary" type="button" data-modal-close>취소</button><button class="button primary" type="submit">등록</button></footer></form></div></div>
</main>
</html>
