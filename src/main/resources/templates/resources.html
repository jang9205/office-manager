<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: shell('자료실', ~{::main})}">
<main>
    <section class="page-heading"><div><h2>자료실</h2><p>업무에 필요한 문서와 파일을 안전하게 공유합니다.</p></div><button sec:authorize="hasAuthority('RESOURCE:MANAGE')" class="button primary" data-modal-open="resourceModal">＋ 자료 등록</button></section>
    <form class="filter-form" th:action="@{/resources}" method="get" style="margin-bottom:14px"><input type="search" name="keyword" th:value="${keyword}" placeholder="자료 제목 또는 설명 검색"><button class="button secondary">검색</button></form>
    <section class="resource-grid"><article class="card resource-card" th:each="item : ${resources.content}"><div class="file-icon" th:text="${item.extension ?: 'FILE'}">PDF</div><h3 th:text="${item.title}">자료 제목</h3><p th:text="${item.description ?: '설명이 없습니다.'}">설명</p><div class="resource-meta"><span><span th:text="${item.authorName}">작성자</span> · <span th:text="${@viewDate.format(item.createdAt,'yyyy.MM.dd')}">날짜</span></span><span th:text="${'↓ ' + item.downloadCount}">0</span></div><div style="margin-top:12px;display:flex;gap:7px"><a class="button secondary small" th:if="${item.fileId}" th:href="@{/files/{id}(id=${item.fileId},inline=true)}" target="_blank">미리보기</a><a class="button primary small" th:if="${item.fileId}" th:href="@{/files/{id}(id=${item.fileId})}">다운로드</a></div></article></section>
    <div class="empty-state card" th:if="${#lists.isEmpty(resources.content)}"><div class="empty-icon">▰</div><strong>등록된 자료가 없습니다</strong><p>업무 자료를 업로드해 공유해 보세요.</p></div>
    <nav class="pagination" th:if="${resources.totalPages() > 1}"><a th:classappend="${!resources.hasPrevious()} ? 'disabled'" th:href="@{/resources(page=${resources.page - 1},keyword=${keyword})}">‹</a><span class="current" th:text="${resources.page}">1</span><span th:text="${'/' + resources.totalPages()}">/1</span><a th:classappend="${!resources.hasNext()} ? 'disabled'" th:href="@{/resources(page=${resources.page + 1},keyword=${keyword})}">›</a></nav>
    <div class="modal" id="resourceModal"><div class="modal-dialog"><header class="modal-header"><div><h3>자료 등록</h3><p>PDF, Excel, Word, 이미지 등 최대 10MB</p></div><button class="modal-close" data-modal-close>×</button></header><form th:action="@{/content/resources}" method="post" enctype="multipart/form-data" data-multipart-form><div class="modal-body form-grid"><div class="field span-2"><label>제목 *</label><input name="title" required maxlength="200"></div><div class="field span-2"><label>설명</label><textarea name="description"></textarea></div><div class="field span-2"><label>파일 *</label><input type="file" name="file" required></div></div><footer class="modal-footer"><button class="button secondary" type="button" data-modal-close>취소</button><button class="button primary" type="submit">업로드</button></footer></form></div></div>
</main>
</html>
