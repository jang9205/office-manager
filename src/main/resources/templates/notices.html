<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: shell('공지사항', ~{::main})}">
<main>
    <section class="page-heading"><div><h2>공지사항</h2><p>회사의 주요 소식과 안내를 확인하세요.</p></div><div class="page-actions" sec:authorize="hasAuthority('NOTICE:MANAGE')"><a class="button secondary" th:href="@{/excel/notices}">↓ 엑셀</a><button class="button primary" data-modal-open="noticeModal">＋ 공지 등록</button></div></section>
    <form class="filter-form" th:action="@{/notices}" method="get" style="margin-bottom:14px"><input type="search" name="keyword" th:value="${keyword}" placeholder="공지 제목 또는 내용 검색"><button class="button secondary">검색</button></form>
    <article class="card"><div class="table-wrap"><table><thead><tr><th>분류</th><th>제목</th><th>작성자</th><th>게시일</th><th>조회</th><th>첨부</th><th></th></tr></thead><tbody><tr th:each="notice : ${notices.content}"><td><span class="status info" th:text="${notice.categoryName ?: '일반'}">일반</span></td><td><a th:href="@{/notices/{id}(id=${notice.noticeId})}"><strong><span class="notice-pin" th:if="${notice.pinned}">[중요] </span><span th:text="${notice.title}">제목</span></strong></a></td><td th:text="${notice.authorName}">관리자</td><td th:text="${notice.publishedAt == null ? '-' : @viewDate.format(notice.publishedAt,'yyyy.MM.dd')}">날짜</td><td th:text="${notice.viewCount}">0</td><td th:text="${notice.attachmentCount}">0</td><td><button sec:authorize="hasAuthority('NOTICE:MANAGE')" class="button danger small" th:attr="data-api-action=@{/api/v1/admin/notices/{id}(id=${notice.noticeId})}" data-method="DELETE" data-confirm="이 공지를 삭제할까요?">삭제</button></td></tr></tbody></table></div><div class="empty-state" th:if="${#lists.isEmpty(notices.content)}"><div class="empty-icon">◉</div><strong>공지사항이 없습니다</strong><p>새로운 소식이 등록되면 이곳에 표시됩니다.</p></div><nav class="pagination" th:if="${notices.totalPages() > 1}"><a th:classappend="${!notices.hasPrevious()} ? 'disabled'" th:href="@{/notices(page=${notices.page - 1},keyword=${keyword})}">‹</a><span class="current" th:text="${notices.page}">1</span><span th:text="${'/' + notices.totalPages()}">/1</span><a th:classappend="${!notices.hasNext()} ? 'disabled'" th:href="@{/notices(page=${notices.page + 1},keyword=${keyword})}">›</a></nav></article>
    <div class="modal" id="noticeModal"><div class="modal-dialog wide"><header class="modal-header"><div><h3>공지사항 등록</h3><p>전체 사원에게 공유할 내용을 작성하세요.</p></div><button class="modal-close" data-modal-close>×</button></header><form th:action="@{/content/notices}" method="post" enctype="multipart/form-data" data-multipart-form><div class="modal-body form-grid"><div class="field"><label>분류</label><select name="categoryId"><option value="">일반</option><option th:each="category : ${categories}" th:value="${category.categoryId}" th:text="${category.categoryName}"></option></select></div><div class="field"><label>첨부파일</label><input type="file" name="file"></div><div class="field span-2"><label>제목 *</label><input name="title" required maxlength="200"></div><div class="field span-2"><label>내용 *</label><textarea name="content" required style="min-height:180px"></textarea></div><label class="check-row"><input type="checkbox" name="pinned" value="true"> 상단 고정</label><input type="hidden" name="published" value="true"></div><footer class="modal-footer"><button type="button" class="button secondary" data-modal-close>취소</button><button class="button primary" type="submit">공지 등록</button></footer></form></div></div>
</main>
</html>
