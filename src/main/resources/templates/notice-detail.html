<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{fragments/layout :: shell('공지사항', ~{::main})}">
<main>
    <section class="page-heading"><div><a class="text-button" th:href="@{/notices}">← 공지 목록</a></div><div class="page-actions" sec:authorize="hasAuthority('NOTICE:MANAGE')"><button class="button secondary" data-modal-open="noticeEditModal">수정</button><button class="button danger" th:attr="data-api-action=@{/api/v1/admin/notices/{id}(id=${notice.noticeId})}" data-method="DELETE" data-confirm="이 공지를 삭제할까요?" data-success-url="/notices">삭제</button></div></section>
    <article class="card article"><header class="article-header"><span class="status info" th:text="${notice.categoryName ?: '일반'}">일반</span><h2><span class="notice-pin" th:if="${notice.pinned}">[중요] </span><span th:text="${notice.title}">제목</span></h2><div class="article-meta"><span th:text="${notice.authorName}">작성자</span><span th:text="${notice.publishedAt == null ? '-' : @viewDate.format(notice.publishedAt,'yyyy.MM.dd HH:mm')}">게시일</span><span th:text="${'조회 ' + notice.viewCount}">조회</span></div></header><div class="article-content" th:text="${notice.content}">내용</div><div th:if="${!#lists.isEmpty(attachments)}"><h3 style="font-size:13px">첨부파일</h3><div class="list" style="border:1px solid var(--border);border-radius:12px"><a class="list-item" th:each="file : ${attachments}" th:href="@{/files/{id}(id=${file.fileId})}"><span class="list-icon">↓</span><span class="list-copy"><strong th:text="${file.originalName}">파일</strong><small th:text="${#numbers.formatDecimal(file.sizeBytes / 1024.0,1,1) + ' KB'}">크기</small></span><span class="text-button">다운로드</span></a></div></div></article>
    <div class="modal" id="noticeEditModal" sec:authorize="hasAuthority('NOTICE:MANAGE')"><div class="modal-dialog wide"><header class="modal-header"><div><h3>공지사항 수정</h3><p>게시된 공지의 분류와 내용을 변경합니다.</p></div><button class="modal-close" data-modal-close>×</button></header><form th:action="@{/api/v1/admin/notices/{id}(id=${notice.noticeId})}" method="post" data-method="PUT" data-json-form th:attr="data-success-url=@{/notices/{id}(id=${notice.noticeId})}"><div class="modal-body form-grid"><div class="field span-2"><label>분류</label><select name="categoryId"><option value="">일반</option><option th:each="category : ${categories}" th:value="${category.categoryId}" th:text="${category.categoryName}" th:selected="${category.categoryId == notice.categoryId}"></option></select></div><div class="field span-2"><label>제목 *</label><input name="title" required maxlength="200" th:value="${notice.title}"></div><div class="field span-2"><label>내용 *</label><textarea name="content" required maxlength="30000" style="min-height:180px" th:text="${notice.content}"></textarea></div><label class="check-row"><input type="checkbox" name="pinned" th:checked="${notice.pinned}"> 상단 고정</label><input type="hidden" name="published" value="true"></div><footer class="modal-footer"><button class="button secondary" type="button" data-modal-close>취소</button><button class="button primary" type="submit">수정 저장</button></footer></form></div></div>
</main>
</html>
