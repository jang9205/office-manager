<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell('전자결재', ~{::main})}">
<main>
    <section class="page-heading"><div><h2>전자결재</h2><p>내 결재 문서와 처리해야 할 요청을 관리합니다.</p></div><button class="button primary" data-modal-open="approvalModal">＋ 새 결재</button></section>
    <section class="grid grid-3" style="margin-bottom:18px">
        <article class="card metric-card warning"><div class="metric-top"><span class="metric-label">내 결재 대기</span><span class="metric-icon">✓</span></div><div class="metric-value" th:text="${#lists.size(tasks)}">0</div><div class="metric-foot">처리가 필요한 문서</div></article>
        <article class="card metric-card success"><div class="metric-top"><span class="metric-label">승인 완료</span><span class="metric-icon">↗</span></div><div class="metric-value" th:text="${#lists.size(documents.?[status == 'APPROVED'])}">0</div><div class="metric-foot">내가 참여한 문서</div></article>
        <article class="card metric-card"><div class="metric-top"><span class="metric-label">전체 문서</span><span class="metric-icon">▤</span></div><div class="metric-value" th:text="${#lists.size(documents)}">0</div><div class="metric-foot">최근 100건 기준</div></article>
    </section>
    <section class="grid grid-2" style="align-items:start">
        <article class="card"><header class="card-header"><div><h3>처리할 결재</h3><p>내 차례가 된 문서입니다.</p></div></header><div class="list"><a class="list-item" th:each="item : ${tasks}" th:href="@{/approvals/{id}(id=${item.documentId})}"><span class="list-icon">✓</span><span class="list-copy"><strong th:text="${item.title}">문서</strong><small><span th:text="${item.drafterName}">기안자</span> · <span th:text="${item.drafterDepartment ?: '-'}">부서</span></small></span><span class="status pending">대기</span></a><div class="empty-state" th:if="${#lists.isEmpty(tasks)}"><div class="empty-icon">✓</div><strong>처리할 문서가 없습니다</strong><p>결재함이 깨끗합니다.</p></div></div></article>
        <article class="card"><header class="card-header"><div><h3>최근 결재 문서</h3><p>기안하거나 결재선에 포함된 문서</p></div></header><div class="list"><a class="list-item" th:each="item : ${documents}" th:href="@{/approvals/{id}(id=${item.documentId})}"><span class="list-icon" th:text="${item.documentType == 'LEAVE' ? '☀' : '▤'}">▤</span><span class="list-copy"><strong th:text="${item.title}">문서</strong><small><span th:text="${item.documentNumber}">번호</span> · <span th:text="${item.drafterName}">기안자</span></small></span><span class="status" th:classappend="${#strings.toLowerCase(item.status)}" th:text="${item.status == 'PENDING' ? '진행 중' : (item.status == 'APPROVED' ? '승인' : (item.status == 'REJECTED' ? '반려' : item.status))}">진행</span></a><div class="empty-mini" th:if="${#lists.isEmpty(documents)}">결재 문서가 없습니다.</div></div></article>
    </section>
    <div class="modal" id="approvalModal"><div class="modal-dialog"><header class="modal-header"><div><h3>일반 결재 작성</h3><p>부서장과 관리자 순서로 결재가 진행됩니다.</p></div><button class="modal-close" data-modal-close>×</button></header><form th:action="@{/content/approvals}" method="post" enctype="multipart/form-data" data-multipart-form><div class="modal-body form-grid"><div class="field span-2"><label>제목 *</label><input name="title" required maxlength="200"></div><div class="field span-2"><label>내용 *</label><textarea name="content" required maxlength="10000" style="min-height:180px"></textarea></div><div class="field span-2"><label>첨부파일</label><input type="file" name="file"><small>최대 10MB, 문서·이미지·압축 파일을 첨부할 수 있습니다.</small></div></div><footer class="modal-footer"><button class="button secondary" type="button" data-modal-close>취소</button><button class="button primary" type="submit">결재 요청</button></footer></form></div></div>
</main>
</html>
