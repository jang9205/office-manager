<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: shell('사내쪽지', ~{::main})}">
<main data-tabs-root>
    <section class="page-heading"><div><h2>사내쪽지</h2><p>구성원에게 간단한 업무 메시지를 전달하세요.</p></div><button class="button primary" data-modal-open="messageModal">＋ 쪽지 보내기</button></section>
    <div class="toolbar"><div class="tabs"><button class="active" data-tab="inbox">받은 쪽지 <span th:text="${#lists.size(inbox)}">0</span></button><button data-tab="sent">보낸 쪽지 <span th:text="${#lists.size(sent)}">0</span></button></div></div>
    <article class="card active" data-tab-panel="inbox"><div class="list"><a class="list-item" th:each="item : ${inbox}" href="#" th:classappend="${item.readAt == null} ? ' message-unread'" th:attr="data-api-action=@{/api/v1/messages/{id}/read(id=${item.messageId})}" data-method="POST"><span class="mini-avatar" th:text="${#strings.substring(item.senderName,0,1)}">박</span><span class="list-copy"><strong th:text="${item.subject}">제목</strong><small><span th:text="${item.senderName}">보낸 사람</span> · <span th:text="${#strings.abbreviate(item.body,80)}">내용</span></small></span><span class="list-meta" th:text="${@viewDate.format(item.createdAt,'M.d HH:mm')}">날짜</span></a><div class="empty-state" th:if="${#lists.isEmpty(inbox)}"><div class="empty-icon">✉</div><strong>받은 쪽지가 없습니다</strong></div></div></article>
    <article class="card" data-tab-panel="sent"><div class="list"><div class="list-item" th:each="item : ${sent}"><span class="mini-avatar" th:text="${#strings.substring(item.recipientName,0,1)}">이</span><span class="list-copy"><strong th:text="${item.subject}">제목</strong><small><span th:text="${'받는 사람 ' + item.recipientName}">받는 사람</span> · <span th:text="${#strings.abbreviate(item.body,80)}">내용</span></small></span><span class="status" th:classappend="${item.readAt == null ? 'pending' : 'sent'}" th:text="${item.readAt == null ? '전송' : '읽음'}">전송</span></div><div class="empty-state" th:if="${#lists.isEmpty(sent)}"><div class="empty-icon">✉</div><strong>보낸 쪽지가 없습니다</strong></div></div></article>
    <div class="modal" id="messageModal"><div class="modal-dialog"><header class="modal-header"><div><h3>쪽지 보내기</h3><p>사내 구성원에게 메시지를 전송합니다.</p></div><button class="modal-close" data-modal-close>×</button></header><form th:action="@{/api/v1/messages}" method="post" data-json-form data-success-url="/messages"><div class="modal-body form-grid"><div class="field span-2"><label>받는 사람 *</label><select name="recipientAccountId" required><option value="">선택</option><option th:each="item : ${recipients}" th:value="${item.accountId}" th:text="${item.employeeName + ' · ' + (item.departmentName ?: '-')}"></option></select></div><div class="field span-2"><label>제목 *</label><input name="subject" maxlength="200" required></div><div class="field span-2"><label>내용 *</label><textarea name="body" required style="min-height:160px"></textarea></div></div><footer class="modal-footer"><button class="button secondary" type="button" data-modal-close>취소</button><button class="button primary" type="submit">보내기</button></footer></form></div></div>
</main>
</html>
